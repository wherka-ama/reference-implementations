name: Release green-code collection
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - name: Publish explicitly requested experiment release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create green-code-v0.1.0 \
            --target "$GITHUB_SHA" \
            --title green-code-v0.1.0 \
            --notes "Experimental green-code collection; not a production release." \
            dist/green-code/green-code.bundle.zip dist/green-code/deployment-manifest.yml
