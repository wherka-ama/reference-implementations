name: Validate Collections & Skills

on:
  pull_request:
    branches: [main]
    paths:
      - 'collections/**'
      - 'skills/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'agents/**'
      - 'docs/collections/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'collections/**'
      - 'skills/**'
      - 'instructions/**'
      - 'prompts/**'
      - 'agents/**'
      - 'docs/collections/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate AI Primitives Hub Collections & Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate collections
        run: npm run validate -- --output-markdown validation-comment.md

      - name: Validate agent skills
        run: npm run validate:skills
