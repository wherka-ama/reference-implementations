name: Offline skill evaluation POC
on:
  pull_request:
    paths:
      - evals/**
      - tools/gsf/green-code-skill/**
      - package.json
      - .github/workflows/skill-evaluation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run eval:plan
