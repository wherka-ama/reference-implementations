name: Validate collections
on:
  pull_request:
    paths:
      - collections/**
      - tools/gsf/green-code-skill/**
      - package.json
      - package-lock.json
      - .github/workflows/collections.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: green-code-bundle
          path: dist/
          if-no-files-found: error
